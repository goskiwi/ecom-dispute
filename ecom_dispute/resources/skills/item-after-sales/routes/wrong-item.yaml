route_id: wrong-item
name: 错件争议
report_type: wrong_item
match: {description: 用户收到的SKU与订单商品不一致。, business_types: [wrong_item], positive_examples: [收到的不是我买的商品], negative_examples: [商品数量少了一件]}
start_stage: ANALYZE
core_tools: [get_order, get_order_items, get_warehouse_pack_record, get_claim_attachments, read_policy]
lazy_tools: []
required_evidence: [conversation, order, order_item, warehouse_pack, policy]
optional_evidence: [claim_attachment]
allowed_decisions: [wrong_item_warehouse_mismatch, wrong_item_not_verified, manual_review]
decision_strategy: wrong_item
stages:
  ANALYZE: {mode: agent, objective: 提取用户声称收到的商品, instruction_file: stages/analyze.md, default_next: VERIFY}
  VERIFY: {mode: deterministic, objective: 查询订单SKU、仓库扫描、附件和政策, tools: [get_order, get_order_items, get_warehouse_pack_record, get_claim_attachments, read_policy], default_next: DECIDE}
  DECIDE: {mode: deterministic, objective: 核对订单和打包SKU, default_next: FUSE_AND_REVIEW}
  FUSE_AND_REVIEW: {mode: deterministic, objective: 合并商品与附件证据}

