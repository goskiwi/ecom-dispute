route_id: delivered-not-received
name: 显示送达但未收到
report_type: delivered_not_received
match:
  description: 系统或物流显示送达，但用户明确否认收到。
  business_types:
  - delivered_not_received
  positive_examples:
  - 物流显示签收但家里没有
  negative_examples:
  - 包裹仍在运输中
start_stage: ANALYZE
core_tools: &id001
- get_order
- get_logistics_events
- get_delivery_proof
- get_delivery_address
- read_policy
lazy_tools: []
required_evidence:
- conversation
- order
- policy
optional_evidence: []
allowed_decisions:
- delivery_proof_missing
- delivery_receipt_disputed
- delivery_not_marked_delivered
- manual_review
decision_strategy: delivered_not_received
stages:
  ANALYZE:
    mode: agent
    objective: 提取显示送达但未收到的用户主张、客服行为和关键边界
    instruction_file: stages/analyze.md
    default_next: VERIFY
  VERIFY:
    mode: deterministic
    objective: 查询显示送达但未收到所需业务证据
    tools: *id001
    default_next: DECIDE
  DECIDE:
    mode: deterministic
    objective: 依据证据和政策执行显示送达但未收到确定性策略
    default_next: FUSE_AND_REVIEW
  FUSE_AND_REVIEW:
    mode: deterministic
    objective: 合并证据冲突并创建必要的人工复检任务
