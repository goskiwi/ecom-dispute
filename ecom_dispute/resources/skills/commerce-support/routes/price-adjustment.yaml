route_id: price-adjustment
name: 价格调整
report_type: price_adjustment
match:
  description: 价保、竞品价格匹配和购买后降价。
  business_types:
  - price_adjustment
  positive_examples:
  - 昨天买完今天降价能补差吗
  negative_examples:
  - 退款金额少了
start_stage: ANALYZE
core_tools: &id001
- get_order
- get_price_records
- read_policy
lazy_tools: []
required_evidence:
- conversation
- price
- policy
optional_evidence: []
allowed_decisions:
- price_adjustment_eligible
- price_adjustment_ineligible
- price_adjustment_completed
- price_record_conflict
- manual_review
decision_strategy: price_adjustment
stages:
  ANALYZE:
    mode: agent
    objective: 提取价格调整的用户主张、客服行为和关键边界
    instruction_file: stages/analyze.md
    default_next: VERIFY
  VERIFY:
    mode: deterministic
    objective: 查询价格调整所需业务证据
    tools: *id001
    default_next: DECIDE
  DECIDE:
    mode: deterministic
    objective: 依据证据和政策执行价格调整确定性策略
    default_next: FUSE_AND_REVIEW
  FUSE_AND_REVIEW:
    mode: deterministic
    objective: 合并证据冲突并创建必要的人工复检任务
