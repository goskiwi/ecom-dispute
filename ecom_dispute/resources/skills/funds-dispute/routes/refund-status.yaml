route_id: refund-status
name: 退款状态争议
report_type: refund_dispute
match:
  description: 用户对退款是否发起、处理进度或到账状态存在争议。
  business_types:
    - refund
  positive_examples:
    - 退款为什么还没发起
    - 系统显示退款成功但银行卡没到账
  negative_examples:
    - 包裹为什么还没送到
start_stage: ANALYZE
core_tools:
  - get_order
  - get_payment_records
  - get_refund_records
  - get_after_sales_case
  - read_policy
lazy_tools: []
required_evidence:
  - conversation
  - order
  - payment
  - after_sales
  - policy
optional_evidence:
  - refund
allowed_decisions:
  - refund_not_initiated_overdue
  - refund_pending_within_sla
  - refund_processing_within_sla
  - refund_arrival_overdue
  - refund_completed
  - refund_record_conflict
  - manual_review
decision_strategy: refund_status
stages:
  ANALYZE:
    mode: agent
    objective: 提取退款相关业务事实和交互行为
    instruction_file: stages/analyze.md
    default_next: VERIFY
  VERIFY:
    mode: deterministic
    objective: 并行查询订单、支付、退款、售后和事发时政策
    tools:
      - get_order
      - get_payment_records
      - get_refund_records
      - get_after_sales_case
      - read_policy
    default_next: DECIDE
  DECIDE:
    mode: deterministic
    objective: 根据资金状态机、时限和证据执行裁决
    default_next: FUSE_AND_REVIEW
  FUSE_AND_REVIEW:
    mode: deterministic
    objective: 校验证据、合并冲突并创建必要的复检任务

