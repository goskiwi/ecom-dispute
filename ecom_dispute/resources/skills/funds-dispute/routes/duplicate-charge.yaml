route_id: duplicate-charge
name: 重复扣款
report_type: duplicate_charge
match:
  description: 同一有效订单出现多笔重复扣款。
  business_types:
  - duplicate_charge
  positive_examples:
  - 同一订单银行卡扣了两次
  negative_examples:
  - 我不认识这笔唯一扣款
start_stage: ANALYZE
core_tools: &id001
- get_order
- get_payment_records
- get_refund_records
- read_policy
lazy_tools: []
required_evidence:
- conversation
- order
- payment
- policy
optional_evidence: []
allowed_decisions:
- duplicate_charge_confirmed
- duplicate_charge_pending_authorization
- duplicate_charge_not_found
- manual_review
decision_strategy: duplicate_charge
stages:
  ANALYZE:
    mode: agent
    objective: 提取重复扣款的用户主张、客服行为和关键边界
    instruction_file: stages/analyze.md
    default_next: VERIFY
  VERIFY:
    mode: deterministic
    objective: 查询重复扣款所需业务证据
    tools: *id001
    default_next: DECIDE
  DECIDE:
    mode: deterministic
    objective: 依据证据和政策执行重复扣款确定性策略
    default_next: FUSE_AND_REVIEW
  FUSE_AND_REVIEW:
    mode: deterministic
    objective: 合并证据冲突并创建必要的人工复检任务
