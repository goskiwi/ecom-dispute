route_id: cart-issue
name: 购物车故障
report_type: cart_issue
match:
  description: 商品无法加入、移除或购物车状态异常。
  business_types:
  - cart_issue
  positive_examples:
  - 商品无法加入购物车
  negative_examples:
  - 商品只是没有库存
start_stage: ANALYZE
core_tools: &id001
- get_cart_events
- get_site_health
lazy_tools: []
required_evidence:
- conversation
- cart_event
optional_evidence:
- site_health
allowed_decisions:
- cart_recovered
- cart_item_unavailable
- cart_state_conflict
- manual_review
decision_strategy: cart_issue
stages:
  ANALYZE:
    mode: agent
    objective: 提取购物车故障的用户主张、客服行为和关键边界
    instruction_file: stages/analyze.md
    default_next: VERIFY
  VERIFY:
    mode: deterministic
    objective: 查询购物车故障所需业务证据
    tools: *id001
    default_next: DECIDE
  DECIDE:
    mode: deterministic
    objective: 依据证据和政策执行购物车故障确定性策略
    default_next: FUSE_AND_REVIEW
  FUSE_AND_REVIEW:
    mode: deterministic
    objective: 合并证据冲突并创建必要的人工复检任务
