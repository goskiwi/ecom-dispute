route_id: escalation-requirement-check
name: 必要升级核验
report_type: escalation_requirement_check
match:
  description: 核验需要复检时是否完成明确升级。
  business_types:
  - escalation_requirement_check
  positive_examples:
  - 冲突案件没有转人工
  negative_examples:
  - 无冲突且无需升级
start_stage: ANALYZE
core_tools: &id001
- read_policy
lazy_tools: []
required_evidence:
- conversation
- policy
optional_evidence: []
allowed_decisions:
- escalation_not_required
- required_escalation_present
- required_escalation_missing
- manual_review
decision_strategy: escalation_requirement_check
stages:
  ANALYZE:
    mode: agent
    objective: 提取必要升级核验的用户主张、客服行为和关键边界
    instruction_file: stages/analyze.md
    default_next: VERIFY
  VERIFY:
    mode: deterministic
    objective: 查询必要升级核验所需业务证据
    tools: *id001
    default_next: DECIDE
  DECIDE:
    mode: deterministic
    objective: 依据证据和政策执行必要升级核验确定性策略
    default_next: FUSE_AND_REVIEW
  FUSE_AND_REVIEW:
    mode: deterministic
    objective: 合并证据冲突并创建必要的人工复检任务
