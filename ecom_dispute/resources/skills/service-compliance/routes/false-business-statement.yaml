route_id: false-business-statement
name: 错误业务陈述
report_type: false_business_statement
match: {description: 客服陈述与订单、支付、退款或物流事实冲突。, business_types: [compliance_false_statement]}
start_stage: ANALYZE
core_tools: [read_policy]
lazy_tools: []
required_evidence: [conversation, policy]
optional_evidence: [order, payment, refund, logistics]
allowed_decisions: [false_statement_found, false_statement_not_found]
decision_strategy: false_business_statement
stages:
  ANALYZE: {mode: deterministic, objective: 读取已提取客服业务事实, default_next: VERIFY}
  VERIFY: {mode: deterministic, objective: 读取客服合规政策, tools: [read_policy], default_next: DECIDE}
  DECIDE: {mode: deterministic, objective: 检查客服陈述与业务证据冲突, default_next: FUSE_AND_REVIEW}
  FUSE_AND_REVIEW: {mode: deterministic, objective: 生成独立合规Finding}

