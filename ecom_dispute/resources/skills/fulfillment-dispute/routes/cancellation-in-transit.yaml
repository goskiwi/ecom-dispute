route_id: cancellation-in-transit
name: 运输中取消
report_type: cancellation_in_transit
match:
  description: 用户申请取消订单时，订单已经或即将进入物流运输。
  business_types: [cancellation_in_transit]
  positive_examples: [取消后商家还是发货了, 运输中的订单怎么还没退款]
  negative_examples: [只是物流延迟没有申请取消]
start_stage: ANALYZE
core_tools: [get_order, get_logistics_events, get_cancellation_request, get_refund_records, read_policy]
lazy_tools: []
required_evidence: [conversation, order, cancellation_request, policy]
optional_evidence: [logistics, refund]
allowed_decisions: [cancel_before_pickup_but_shipped, cancel_after_pickup, cancellation_refund_missing, cancellation_completed, manual_review]
decision_strategy: cancellation_in_transit
stages:
  ANALYZE: {mode: agent, objective: 提取取消时间和退款诉求, instruction_file: stages/analyze.md, default_next: VERIFY}
  VERIFY: {mode: deterministic, objective: 查询订单、物流、取消申请、退款和政策, tools: [get_order, get_logistics_events, get_cancellation_request, get_refund_records, read_policy], default_next: DECIDE}
  DECIDE: {mode: deterministic, objective: 对齐取消申请与揽收时间并判断退款状态, default_next: FUSE_AND_REVIEW}
  FUSE_AND_REVIEW: {mode: deterministic, objective: 合并履约和取消状态冲突}
