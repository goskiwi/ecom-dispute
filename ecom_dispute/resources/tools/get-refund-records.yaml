tool_id: get_refund_records
name: 查询退款流水
description: 查询当前订单的退款发起、处理和完成记录。
input_schema:
  type: object
  additionalProperties: false
  properties: {}
output_schema:
  type: object
  additionalProperties: true
timeout_ms: 3000
scope_bindings:
  order_id:
    source: case.order_id
    mode: RUNTIME_INJECT
executor: get_refund_records
result_adapter: refund_records
error_mapping:
  NOT_FOUND: BUSINESS_NOT_FOUND
  INVALID_ARGUMENT: TOOL_ARGUMENT_INVALID

