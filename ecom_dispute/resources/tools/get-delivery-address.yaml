tool_id: get_delivery_address
name: 查询脱敏收货地址
description: 查询当前订单的城市、脱敏地址和联系人尾号。
input_schema:
  type: object
  additionalProperties: false
  properties: {}
output_schema:
  type: object
  additionalProperties: true
timeout_ms: 3000
scope_bindings:
  order_id:
    source: case.order_id
    mode: RUNTIME_INJECT
executor: get_delivery_address
result_adapter: delivery_address
error_mapping:
  NOT_FOUND: BUSINESS_NOT_FOUND
  INVALID_ARGUMENT: TOOL_ARGUMENT_INVALID

