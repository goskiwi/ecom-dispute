tool_id: get_logistics_events
name: 查询物流事件
description: 查询当前订单的揽收、运输、异常、派送和签收事件。
input_schema:
  type: object
  additionalProperties: false
  properties: {}
output_schema:
  type: object
  additionalProperties: true
timeout_ms: 3000
scope_bindings:
  order_id:
    source: case.order_id
    mode: RUNTIME_INJECT
executor: get_logistics_events
result_adapter: logistics_events
error_mapping:
  NOT_FOUND: BUSINESS_NOT_FOUND
  INVALID_ARGUMENT: TOOL_ARGUMENT_INVALID

